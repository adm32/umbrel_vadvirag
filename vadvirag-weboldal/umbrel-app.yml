releaseNotes: >-
  Látogatottsági statisztika sütik nélkül (élő és napi látogatók, források, eszközök,
  nyelvek, országok, megnézett részek, kosárba tett ételek, keresett települések) és
  hibanaplózás a Vadvirág Irányítópult számára. Javítva: frissítés után a telefonok
  néha a régi stíluslapot és feliratokat mutatták (régi fájlok a gyorsítótárban).
