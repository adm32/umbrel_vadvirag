<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rendelések">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Rendelések</title>
<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);
  --label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);
  --red:#ff3b30;--green:#34c759;--blue:#007aff;--orange:#ff9500;--purple:#af52de;--teal:#30b0c7;
  --bar:rgba(242,242,247,.78);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.16);
  --label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);
  --red:#ff453a;--green:#30d158;--blue:#0a84ff;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;
  --bar:rgba(0,0,0,.72);--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
a{color:var(--blue);text-decoration:none}

/* ---- navigációs sáv ---- */
.nav{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s;padding-top:env(safe-area-inset-top)}
.nav.scrolled{border-bottom-color:var(--sep)}
.navrow{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 20px 0;min-height:44px}
.navrow .sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);color:var(--blue);transition:transform .15s,background .15s}
.ibtn:active{transform:scale(.92);background:var(--fill)}
.ibtn svg{width:19px;height:19px}
.ttl{max-width:1240px;margin:0 auto;padding:2px 20px 10px}
.ttl h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em}
.ttl .sub{color:var(--label2);font-size:15px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}

/* ---- szegmentált vezérlő ---- */
.segwrap{max-width:1240px;margin:0 auto;padding:0 20px 12px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;position:relative;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:max-content;padding:7px 14px;font-size:14px;font-weight:500;border-radius:7px;position:relative;z-index:1;white-space:nowrap;color:var(--label);transition:color .2s}
.seg .knob{position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:left .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1);z-index:0}
@media (prefers-color-scheme:dark){.seg .knob{background:#636366}}
.seg .n{display:inline-block;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;margin-left:6px;background:var(--fill);color:var(--label2);font-variant-numeric:tabular-nums}
.seg .n.hot{background:var(--red);color:#fff}

/* ---- lista ---- */
main{max-width:1240px;margin:0 auto;padding:8px 20px 120px}
#list{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));align-items:start}
@media (max-width:600px){.seg button{padding:7px 6px;font-size:13px;min-width:0}.seg .n{margin-left:4px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-size:11px}.fab{width:58px;height:58px;padding:0;justify-content:center;border-radius:50%}.fab .ft{display:none}.fab svg{width:26px;height:26px}main{padding:4px 12px 120px}#list{grid-template-columns:1fr;gap:12px}.navrow,.ttl,.segwrap{padding-left:16px;padding-right:16px}}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:in .35s cubic-bezier(.2,.9,.3,1) both;position:relative}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.card.new::before{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 0 0 2px var(--orange);pointer-events:none;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--orange) 35%,transparent)}}
.card.done,.card.rejected{opacity:.72}
.ch{padding:16px 18px 0;display:flex;align-items:flex-start;gap:12px}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:17px;color:#fff}
.who{flex:1;min-width:0}
.who .nm{font-size:19px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .meta{font-size:13px;color:var(--label2);margin-top:3px;font-variant-numeric:tabular-nums}
.pill{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.new{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.preparing{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pill.done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.rejected{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}

/* csoportosított sorok (iOS beállítás-stílus) */
.grp{margin:14px 18px 0;background:var(--card2);border-radius:12px;overflow:hidden}
.grp .r{display:flex;align-items:center;gap:12px;padding:11px 14px;font-size:15px;position:relative;min-height:44px}
.grp .r+.r::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ic svg{width:16px;height:16px}
.r .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.r .v small{display:block;color:var(--label2);font-size:13px}
.r .acc{color:var(--label2);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.r .acc.warn{color:var(--orange)}
.items{margin:14px 18px 0;font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.items .lbl,.sec-lbl{display:block;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px;font-weight:500}
.note{margin:10px 18px 0;font-size:15px;color:var(--label2)}
.mail{margin:12px 18px 0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--label2)}
.mail.ok{color:var(--green)}.mail.bad{color:var(--red)}
.mail .lnk{color:var(--blue);font-weight:500}
.acts{display:flex;gap:10px;padding:16px 18px 18px}
.btn{flex:1;height:50px;border-radius:14px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.fill-green{background:var(--green);color:#fff}
.btn.fill-blue{background:var(--blue);color:#fff}
.btn.tint-red{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.btn.tint{background:var(--fill2);color:var(--blue)}
.btn.sq{flex:none;width:50px}
.btn svg{width:20px;height:20px}

.empty{grid-column:1/-1;text-align:center;color:var(--label2);padding:90px 20px}
.empty svg{width:56px;height:56px;color:var(--label3);margin-bottom:10px}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:4px}

/* lebegő gomb */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:9;height:54px;padding:0 22px 0 18px;border-radius:27px;background:var(--blue);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px color-mix(in srgb,var(--blue) 40%,transparent);transition:transform .15s}
.fab:active{transform:scale(.95)}
.fab svg{width:22px;height:22px}

/* ---- lapok (sheet) ---- */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0;color:var(--label)}
dialog::backdrop{background:rgba(0,0,0,.32);backdrop-filter:blur(2px)}
dialog[open] .sheet{animation:sheet .38s cubic-bezier(.2,.9,.25,1) both}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--bg);border-radius:22px;width:min(100%,460px);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
@media (max-width:600px){.dwrap{align-items:flex-end;padding:0}.sheet{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom)}}
.shd{display:flex;align-items:center;padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:1}
.shd h2{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
.shd .tb{min-width:72px;color:var(--blue);font-size:17px;padding:6px 0}
.shd .tb.r{text-align:right;font-weight:600}
.shd .tb:disabled{color:var(--label3)}
.sbody{padding:4px 16px 22px}
.hint{color:var(--label2);font-size:13px;padding:8px 16px 0;line-height:1.4}
.flabel{font-size:13px;color:var(--label2);text-transform:uppercase;padding:18px 16px 7px;letter-spacing:.02em}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.list .row{display:flex;align-items:center;min-height:46px;padding:0 16px;position:relative;font-size:17px}
.list .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.list .row input,.list .row textarea,.list .row select{flex:1;border:0;background:transparent;color:var(--label);font:inherit;padding:12px 0;outline:none;min-width:0;resize:none;-webkit-appearance:none;appearance:none}
.list .row textarea{min-height:96px;line-height:1.4}
.list .row .k{width:110px;flex:none;color:var(--label)}
.list .opt{cursor:pointer;gap:12px}
.list .opt .tx{flex:1;padding:12px 0}
.list .opt .ck{color:var(--blue);opacity:0;font-weight:700}
.list .opt.on .ck{opacity:1}
.etas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.eta{background:var(--card);border-radius:14px;padding:16px 0 14px;text-align:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;transition:transform .12s,background .2s,color .2s;box-shadow:inset 0 0 0 0 var(--blue)}
.eta small{display:block;font-size:12px;font-weight:500;color:var(--label2);margin-top:2px}
.eta.on{background:var(--blue);color:#fff}.eta.on small{color:rgba(255,255,255,.8)}
.eta:active{transform:scale(.95)}
.segsm{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0}
.segsm button{flex:1;padding:8px;border-radius:7px;font-size:15px;font-weight:500}
.segsm button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.bigbtn{margin-top:20px;width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:600;color:#fff;transition:transform .12s,filter .12s}
.bigbtn:active{transform:scale(.98);filter:brightness(.92)}
.bigbtn.green{background:var(--green)}.bigbtn.red{background:var(--red)}.bigbtn.blue{background:var(--blue)}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:30;transform:translate(-50%,-140%);opacity:0;visibility:hidden;background:var(--card);color:var(--label);padding:12px 20px 12px 16px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast{transition:transform .45s cubic-bezier(.2,1.2,.3,1),opacity .25s,visibility .25s}
#toast svg{width:20px;height:20px;color:var(--green)}
.offline{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:12px}
.banner{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:16px;animation:in .35s both}
.banner .bi{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.banner .bi svg{width:24px;height:24px}
.banner .bt{flex:1;min-width:0;font-size:15px;color:var(--label2)}
.banner .bt b{display:block;color:var(--label);font-size:17px;margin-bottom:2px}
.banner .bb{flex:none;background:var(--blue);color:#fff;font-weight:600;font-size:15px;height:36px;padding:0 16px;border-radius:18px}
.banner .bx{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill2);color:var(--label2);display:grid;place-items:center}
.banner .bx svg{width:14px;height:14px}
@media (max-width:600px){.banner{flex-wrap:wrap}.banner .bb{order:3;width:100%;height:44px;border-radius:12px}}
.msg{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:10px}
.msg.done{opacity:.55}
.msg .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msg .mk{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.msg .mk.rendezveny{background:color-mix(in srgb,var(--purple) 15%,transparent);color:var(--purple)}
.msg .mk.asztal{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.msg .mn{font-weight:600;font-size:16px}
.msg .mt{margin-left:auto;color:var(--label2);font-size:13px}
.msg .md{margin-top:6px;font-size:15px;font-weight:600}
.msg .mx{margin-top:6px;font-size:15px;white-space:pre-wrap;word-break:break-word;color:var(--label)}
.msg .ma{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg .ma a,.msg .ma button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--fill2);color:var(--blue);font-size:14px;font-weight:600}
.msg .ma svg{width:16px;height:16px}
.ibtn .cnt{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.ibtn .bdg{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.ibtn{position:relative}
.ibtn[hidden]{display:none}
/* ---- Továbbiak menü és a mai nyitvatartás */
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;background:var(--card);text-align:left;color:var(--label);font-size:17px;border-bottom:.5px solid var(--sep)}
.mrow:first-child{border-radius:12px 12px 0 0}.mrow:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.mrow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}.mrow .ic svg{width:18px;height:18px}
.mrow .tx{flex:1;min-width:0}.mrow small{display:block;font-size:13px;color:var(--label2)}
.mrow .chev{color:var(--label3);font-size:20px}
.mgroup{margin-top:16px}
.daybtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.daybtn i{width:8px;height:8px;border-radius:50%;background:currentColor}
.daybtn.paused{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange)}
.daybtn.closed{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.dopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:14px;margin-top:10px;border:2px solid transparent;color:var(--label)}
.dopt[aria-checked=true]{border-color:var(--blue)}
.dopt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--label3);flex:none;margin-top:1px;display:grid;place-items:center}
.dopt[aria-checked=true] .rd{border-color:var(--blue)}.dopt[aria-checked=true] .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue)}
.dopt b{display:block;font-size:17px}.dopt small{display:block;color:var(--label2);font-size:14px;line-height:1.35;margin-top:2px}
.dnote{width:100%;margin-top:8px;border:1px solid var(--sep);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:var(--bg);color:var(--label)}
.dsave{width:100%;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin-top:16px}
/* ---- Előrendelések */
.sheet.wide{width:min(100%,760px)}
.pstrip{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--orange) 13%,var(--card));border-radius:14px;padding:12px 14px;margin:0 0 14px;cursor:pointer;width:100%;text-align:left;color:var(--label)}
.pstrip .pi{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.pstrip .pi svg{width:20px;height:20px}
.pstrip .pt{flex:1;min-width:0;font-size:15px;line-height:1.35}
.pstrip .pt b{display:block;font-size:16px}
.pstrip .go{color:var(--orange);font-weight:700;white-space:nowrap}
.poff{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:4px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.poff .tx{flex:1;min-width:200px}
.poff .tx b{display:block;font-size:17px}
.poff .tx small{color:var(--label2);font-size:13px;line-height:1.35;display:block;margin-top:2px}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--fill);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked=true]{background:var(--green)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.pfilt{display:flex;gap:6px;margin:14px 0 2px;flex-wrap:wrap}
.pfilt button{height:32px;padding:0 14px;border-radius:16px;background:var(--fill2);font-size:14px;font-weight:600;color:var(--label)}
.pfilt button[aria-pressed=true]{background:var(--label);color:var(--bg)}
.pday{margin-top:18px}
.pdh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:0 2px}
.pdh h3{font-size:20px;font-weight:700}
.pdh .rel{background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.pdh .cnt{color:var(--label2);font-size:14px}
.pdh .pr{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;background:var(--fill2);color:var(--blue);font-size:14px;font-weight:600}
.pdh .pr svg{width:16px;height:16px}
.pkit{background:var(--card);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px;line-height:1.5}
.pkit b{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;display:block;margin-bottom:2px}
.pc{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:62px 1fr;gap:4px 12px;position:relative;overflow:hidden}
.pc.uj{box-shadow:inset 4px 0 0 var(--orange)}
.pc.kesz,.pc.lemondva{opacity:.55}

// ---- új rendelés jelzés
function beep(){
  if(!soundOn)return;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[880,1175,1568][i];o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.35);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.4)})}catch(e){}
}

// ---- eszköz-értesítések (Web Push)
const N={on:false,sub:null,devices:0,state:'unknown'};
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function devName(){const u=navigator.userAgent;const os=/Android/.test(u)?'Android':isIOS?'iPhone/iPad':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Eszköz';const br=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'böngésző';return os+' · '+br}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function notifInit(){
  if(!window.isSecureContext){N.state='insecure';return}
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){N.state=isIOS&&!standalone?'ios-install':'unsupported';return}
  try{
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
    N.sub=await reg.pushManager.getSubscription();
    const k=await api('/api/push/key');N.devices=k.devices;
    if(N.sub&&Notification.permission==='granted'){N.on=true;N.state='on';api('/api/push/subscribe',{...N.sub.toJSON(),device:devName()}).catch(()=>{})}
    else N.state=Notification.permission==='denied'?'denied':'off';
  }catch(e){N.state='error';console.log(e)}
}
async function notifEnable(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){N.state=perm==='denied'?'denied':'off';renderNotif();render();return}
    const reg=await navigator.serviceWorker.ready;
    const {key}=await api('/api/push/key');
    N.sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    const r=await api('/api/push/subscribe',{...N.sub.toJSON(),device:devName()});
    N.on=true;N.state='on';N.devices=r.devices;toast('Értesítések bekapcsolva');
  }catch(e){toast('Nem sikerült: '+(e.message||e));N.state='error'}
  renderNotif();lastSig='';render();
}
async function notifDisable(){
  try{if(N.sub){const ep=N.sub.endpoint;await N.sub.unsubscribe();const r=await api('/api/push/unsubscribe',{endpoint:ep});N.devices=r.devices}}catch(e){}
  N.sub=null;N.on=false;N.state='off';toast('Értesítések kikapcsolva');renderNotif();lastSig='';render();
}

function renderNotif(){
  const st={on:['var(--green)',I.check,'Bekapcsolva ezen az eszközön','Új rendelésnél értesítést kapsz, akkor is, ha a böngésző a háttérben van.'],
    off:['#8e8e93',I.bell,'Kikapcsolva ezen az eszközön','Kapcsold be, hogy minden új rendelésről azonnal értesítést kapj.'],
    denied:['var(--red)',I.belloff,'Le vannak tiltva','A böngésző tiltja az értesítéseket ennél a webhelynél.'],
    insecure:['var(--orange)',I.info,'Ezen a címen nem elérhető','A böngészők csak biztonságos (https) címen engedik az értesítéseket.'],
    'ios-install':['var(--orange)',I.info,'Előbb add a Főképernyőhöz','iPhone-on csak a Főképernyőre tett alkalmazás kaphat értesítést.'],
    unsupported:['var(--orange)',I.info,'Ez a böngésző nem támogatja','Használj Chrome-ot (Android, Windows, Mac).'],
    error:['var(--red)',I.info,'Hiba történt','Frissítsd az oldalt, és próbáld újra.'],unknown:['#8e8e93',I.bell,'Ellenőrzés…','']}[N.state]||[];
  let h=`<div class="stat"><span class="si" style="background:${st[0]}">${st[1]}</span><span class="st"><b>${st[2]}</b>${st[3]}</span></div>`;
  h+=`<div class="hint">Bekapcsolt eszközök összesen: <b>${N.devices}</b></div>`;
  if(N.state==='on')h+=`<button class="bigbtn blue" onclick="notifTest()">Teszt értesítés küldése</button><button class="bigbtn ghost red" style="margin-top:10px" onclick="notifDisable()">Kikapcsolás ezen az eszközön</button>`;
  else if(N.state==='off'||N.state==='error')h+=`<button class="bigbtn blue" onclick="notifEnable()">Értesítések bekapcsolása</button>`;
  else if(N.state==='denied')h+=`<div class="flabel">Így engedélyezheted</div><div class="list" style="padding:12px 16px"><ol class="steps"><li>Koppints a címsor bal oldalán lévő ikonra (lakat / beállítások).</li><li>Webhely-beállítások → Értesítések → <b>Engedélyezés</b>.</li><li>Frissítsd az oldalt.</li></ol></div>`;
  else if(N.state==='insecure')h+=`<div class="flabel">Mit tegyél?</div><div class="list" style="padding:12px 16px"><ol class="steps"><li>Nyisd meg a programot a <b>https://…ts.net</b> címen (Tailscale Funnel). A helyi <b>http://</b> címeken a böngésző nem engedi az értesítéseket.</li><li>Lépj be, majd itt kapcsold be az értesítéseket.</li></ol></div>`;
  else if(N.state==='ios-install')h+=`<div class="flabel">Lépések</div><div class="list" style="padding:12px 16px"><ol class="steps"><li>Safariban koppints a <b>Megosztás</b> gombra.</li><li>Válaszd: <b>Főképernyőhöz adás</b>.</li><li>Nyisd meg a „Rendelések” ikont a főképernyőről, és itt kapcsold be az értesítéseket.</li></ol></div>`;
  $('notifBody').innerHTML=h;
}

async function openMsgs(){dMsg.showModal();$('msgBody').innerHTML='<div class="hint">Betöltés…</div>';try{MSGS=await api('/api/messages');renderMsgs()}catch(e){$('msgBody').innerHTML=`<div class="hint">${esc(e.message)}</div>`}}

async function msgDone(id,done){try{await api('/api/messages/'+id+'/done',{done});const m=MSGS.find(x=>x.id===id);if(m)m.done=done;info.messages=MSGS.filter(x=>!x.done).length;msgBadge();renderMsgs()}catch(e){alert(e.message)}}

// ---- Előrendelések (alkalmi ajánlat, pl. Márton-nap): napok szerint, a konyhának összesítve.

const PM={helyben:['Helyben',I.tray],elvitel:['Elvitel',I.bag],kiszallitas:['Kiszállítás',I.car]};

function preBadge(){const b=$('preBtn');if(!b)return;b.hidden=!info.preorder_on;const n=info.preorders||0;
  if(lastPreN>=0&&n>lastPreN)toast('Új előrendelés érkezett');lastPreN=n;

async function openPre(){dPre.showModal();$('preBody').innerHTML='<div class="hint">Betöltés…</div>';try{PRE=await api('/api/preorders');renderPre()}catch(e){$('preBody').innerHTML=`<div class="hint">${esc(e.message)}</div>`}}
function huFrom(d){const x=new Date(d+'T12:00'),n=x.getDate(),u=n%10,tol=u?[3,6,8].includes(u):n!==10;return x.toLocaleDateString('hu-HU',{month:'long'})+' '+n+'-'+(tol?'tól':'től')}
const preDayName=d=>new Date(d+'T12:00').toLocaleDateString('hu-HU',{month:'long',day:'numeric',weekday:'long'});
function preRel(d){const t=new Date(PRE.today+'T12:00'),x=new Date(d+'T12:00');const n=Math.round((x-t)/864e5);return n===0?'ma':n===1?'holnap':''}
function preKitchen(list){const m={};list.filter(p=>p.status!=='lemondva').forEach(p=>p.lines.forEach(l=>{m[l.name]=(m[l.name]||0)+l.qty}));return Object.entries(m)}
function renderPre(){
  const o=PRE.offer,all=PRE.items||[];
  const on=o&&!o.sold_out;
  let h=o?`<div class="poff"><div class="tx"><b>${esc(o.title)}</b><small>${on?'Most látszik a weboldalon, lehet előrendelni.':'Elfogyott – a weboldalon nem látszik, nem lehet előrendelni.'} Kérhető: ${esc(huFrom(o.serve_from))}.</small></div>
    <span style="font-size:14px;font-weight:600;color:var(--label2)">${on?'Rendelhető':'Elfogyott'}</span><button class="sw" role="switch" aria-checked="${on}" aria-label="Rendelhető a weboldalon" onclick="preSoldOut(${on})"></button></div>
    <div class="hint" style="padding:6px 2px 0">Ha elfogyott, kapcsold ki: a weboldalról azonnal eltűnik. A már leadott előrendelések megmaradnak.</div>`:'';
  const cnt=k=>all.filter(k).length;
  const fl={aktiv:['Teendő',p=>p.status==='uj'||p.status==='visszaigazolva'],uj:['Visszahívandó',p=>p.status==='uj'],mind:['Mind',p=>true]};
  h+=`<div class="pfilt">${Object.entries(fl).map(([k,[l,f]])=>`<button aria-pressed="${preFilter===k}" onclick="preFilter='${k}';renderPre()">${l} (${cnt(f)})</button>`).join('')}</div>`;
  const list=all.filter(fl[preFilter][1]).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!list.length){h+=`<div class="pempty">${all.length?'Ebben a nézetben nincs előrendelés.':'Még nem érkezett előrendelés. Ha valaki a weboldalon előrendel, itt jelenik meg, napok szerint.'}</div>`;$('preBody').innerHTML=h;return}
  const days=[...new Set(list.map(p=>p.date))];
  for(const d of days){
    const dl=list.filter(p=>p.date===d),rel=preRel(d),k=preKitchen(dl);
    const mains=dl.filter(p=>p.status!=='lemondva').reduce((s,p)=>s+p.lines.filter(l=>l.key[0]==='m').reduce((a,l)=>a+l.qty,0),0);
    const desserts=dl.filter(p=>p.status!=='lemondva').reduce((s,p)=>s+p.lines.filter(l=>l.key[0]==='d').reduce((a,l)=>a+l.qty,0),0);
    const plat=dl.filter(p=>p.status!=='lemondva').reduce((s,p)=>s+p.lines.filter(l=>l.key[0]==='t').reduce((a,l)=>a+l.qty,0),0);
    h+=`<div class="pday"><div class="pdh"><h3>${esc(preDayName(d))}</h3>${rel?`<span class="rel">${rel}</span>`:''}<span class="cnt">${dl.length} előrendelés · ${mains} főétel${plat?` · ${plat} tál`:''} · ${desserts} desszert</span><button class="pr" onclick="prePrint('${d}')">${I.print}Nyomtatás</button></div>
      ${k.length?`<div class="pkit"><b>A konyhának</b>${k.map(([n,q])=>`${q}× ${esc(n)}`).join('<br>')}</div>`:''}`;
    for(const p of dl){
      const [ml,mi]=PM[p.mode]||['?',''];
      const who=p.mode==='helyben'?`${p.guests} fő`:p.mode==='kiszallitas'?esc(p.city):'';
      const money=`<b>${huf(p.total)} Ft</b>`+(p.pack||p.fee?` (étel ${huf(p.food)}${p.pack?` + doboz ${huf(p.pack)}`:''}${p.fee?` + szállítás ${huf(p.fee)}`:''})`:'')+(p.payment?` · ${esc(p.payment)}`:'');
      const where=p.mode==='kiszallitas'?`<div class="meta">Cím: <b>${esc(p.city)}, ${esc(p.street)}</b>${p.drive_min?` · kb. ${p.drive_min} perc út`:''}</div>`:'';
      const act=p.status==='uj'?`<button class="ok" onclick="preSet(${p.id},'visszaigazolva')">${I.check}Visszahívtam, rendben</button>`:
        p.status==='visszaigazolva'?`<button class="ok" onclick="preSet(${p.id},'kesz')">${I.check}${p.mode==='helyben'?'Kiszolgálva':p.mode==='elvitel'?'Átadva':'Kiszállítva'}</button>`:
        `<button onclick="preSet(${p.id},'visszaigazolva')">${I.undo}Visszaállít</button>`;
      h+=`<div class="pc ${p.status}"><div class="tm">${esc(p.time)}<small>#${p.id}</small></div><div class="bd">
        <div class="top"><span class="pm ${p.mode}">${mi}${ml}${who?' · '+who:''}</span><span class="nm">${esc(p.name)}</span><span class="pst ${p.status}">${PST[p.status]||p.status}</span></div>
        <ul>${p.lines.map(l=>`<li><b>${l.qty}×</b> ${esc(l.name)}</li>`).join('')}</ul>
        ${where}<div class="meta">${money}</div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}
        <div class="meta">Leadva: ${fmtDay(p.at)} ${fmtTime(p.at)}${p.lang&&p.lang!=='hu'?` · ${esc(p.lang.toUpperCase())} nyelvű vendég`:''}</div></div>
        <div class="act"><a href="tel:${esc(p.phone.replace(/[^0-9+]/g,''))}">${I.phone}${esc(p.phone)}</a>${act}${p.status==='uj'||p.status==='visszaigazolva'?`<button class="no" onclick="preSet(${p.id},'lemondva')">${I.x}Lemondva</button>`:''}</div></div>`;
    }
    h+='</div>';
  }
  $('preBody').innerHTML=h;
}
async function preSet(id,status){
  if(status==='lemondva'&&!confirm('Biztosan lemondottnak jelölöd ezt az előrendelést?'))return;
  try{await api('/api/preorders/'+id+'/status',{status});const p=PRE.items.find(x=>x.id===id);if(p)p.status=status;info.preorders=PRE.items.filter(x=>x.status==='uj').length;lastPreN=info.preorders;preBadge();renderPre()}catch(e){alert(e.message)}
}
async function preSoldOut(on){
  if(on&&!confirm('Elfogyott? A weboldalról azonnal eltűnik, és nem lehet tovább előrendelni.'))return;
  try{await api('/api/preorders/soldout',{sold_out:on});PRE.offer.sold_out=on;renderPre();toast(on?'Elfogyott – levettük a weboldalról':'Újra rendelhető a weboldalon')}catch(e){alert(e.message)}
}
function prePrint(d){
  const dl=(PRE.items||[]).filter(p=>p.date===d&&p.status!=='lemondva').sort((a,b)=>a.time.localeCompare(b.time));
  const k=preKitchen(dl);const w=window.open('','_blank');if(!w)return;
  w.document.write(`<html><meta charset="utf-8"><title>Előrendelések – ${esc(d)}</title><body style="font:15px/1.45 -apple-system,system-ui,sans-serif;max-width:640px;margin:20px auto"><h2 style="margin:0">${esc(PRE.offer?PRE.offer.title:'Előrendelések')}</h2><h3 style="margin:4px 0 12px">${esc(preDayName(d))}</h3>
    <b>A konyhának:</b><br>${k.map(([n,q])=>`${q}× ${esc(n)}`).join('<br>')}<hr>`+
    dl.map(p=>`<div style="margin:10px 0"><b style="font-size:18px">${esc(p.time)}</b> · <b>${(PM[p.mode]||['?'])[0].toUpperCase()}</b>${p.mode==='helyben'?` (${p.guests} fő)`:''} · ${esc(p.name)} · ${esc(p.phone)}${p.mode==='kiszallitas'?`<br>${esc(p.city)}, ${esc(p.street)}`:''}<br>${p.lines.map(l=>`${l.qty}× ${esc(l.name)}`).join('<br>')}<br>Összesen: ${huf(p.total)} Ft${p.payment?' · '+esc(p.payment):''}${p.note?`<br><i>${esc(p.note)}</i>`:''}</div>`).join('<hr>')+
    `</body></html>`);w.document.close();w.focus();w.print();
}
if(location.hash==='#elorendeles')setTimeout(openPre,600);

// ---- Nyereményjáték sorsolás
let RF={title:'',link:'',names:'',winners:1,reserves:1,clean:[],off:new Set(),hist:[],src:'',gw:null},rfT=0;
const I_GIFT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
async function openRaffle(){dRaffle.showModal();rfForm();try{const [h,g]=await Promise.all([api('/api/raffle'),api('/api/giveaway').catch(()=>null)]);RF.hist=h;RF.gw=g&&g.active?g:null;rfForm()}catch(e){}}
// Weboldalas nyereményjáték: a jogosult rendelők (telefonszámonként egyszer) betöltése a sorsolóba
function rfGwCard(){const g=RF.gw;if(!g)return '';const G=g.giveaway,n=g.entries.length;
  const till=new Date(G.until.replace(' ','T')).toLocaleDateString('hu-HU',{month:'long',day:'numeric',weekday:'long'})+' '+G.until.slice(11,16);
  return `<div class="flabel">Weboldalas nyereményjáték</div><div class="list"><div class="row"><span class="tx" style="flex:1"><b style="display:block">${esc(G.title.hu)}</b><small style="display:block;color:var(--label2);font-size:13px;margin-top:3px">Weboldalas rendelés ${huf(G.above)} Ft felett (szállítás nélkül), ${esc(till)}-ig · telefonszámonként egyszer · sorsolás: ${esc(G.draw.slice(11,16)||G.draw)}<br>${g.running?'<b style="color:var(--orange)">A játék még tart</b> – a végleges listát a zárás után töltsd be.':'<b style="color:var(--green)">A játék lezárult</b> – lehet sorsolni.'}</small></span></div>
  <div class="row"><span class="tx" style="flex:1"><b>${n}</b> résztvevő${g.running?' eddig':''}</span><button class="rf-load" onclick="rfLoadGw(this)" ${n?'':'disabled'}>Résztvevők betöltése</button></div></div>`}
async function rfLoadGw(b){if(b)b.disabled=true;try{const g=await api('/api/giveaway');RF.gw=g.active?g:null;if(!RF.gw)return;const G=g.giveaway;
  RF.src='orders';RF.title=G.title.hu;RF.link='';RF.names=g.entries.map(e=>e.line).join('\n');RF.winners=Math.min(G.winners||1,Math.max(1,g.entries.length));RF.reserves=Math.min(1,Math.max(0,g.entries.length-RF.winners));RF.off=new Set();rfForm();rfCount()}catch(e){if($('rfErr'))$('rfErr').textContent=e.message}finally{if(b)b.disabled=false}}
function rfFb(){RF.src='';RF.names='';RF.title='';RF.clean=[];RF.off=new Set();RF.winners=1;rfForm()}
function rfForm(){
  const n=RF.clean.length;
  const ord=RF.src==='orders';
  $('rfBody').innerHTML=`<div class="hint" style="padding-top:2px">${ord?'A résztvevők a weboldalas rendelésekből jöttek. A sorsolás véletlenszerű, és minden sorsolás mentésre kerül.':'Húzz nyertest a Facebook-poszt hozzászólói (vagy más résztvevők) közül. A sorsolás véletlenszerű, és minden sorsolás mentésre kerül.'}</div>
  ${ord?'':rfGwCard()}
  <div class="flabel">${ord?'Nyereményjáték':RF.gw?'Facebook-játék':'Nyereményjáték'}</div>
  <div class="list">
    <div class="row"><span class="k">Neve</span><input id="rfTitle" placeholder="pl. Karácsonyi pizza nyeremény" value="${esc(RF.title)}" oninput="RF.title=this.value"></div>
    ${ord?'':`<div class="row"><span class="k">Poszt linkje</span><input id="rfLink" inputmode="url" placeholder="https://www.facebook.com/…" value="${esc(RF.link)}" oninput="RF.link=this.value"></div>`}
  </div>
  <div class="flabel">Résztvevők</div>
  <div class="list"><div class="row"><textarea id="rfNames" style="min-height:150px" placeholder="Másold vagy írd ide a résztvevők nevét, soronként egyet." oninput="RF.names=this.value;rfCount()">${esc(RF.names)}</textarea></div></div>
  <div class="rf-count" id="rfCount">${rfCountTxt()}</div>
  <div id="rfChips">${rfChips()}</div>
  ${ord?`<div class="hint">Minden sor: név – telefonszám – rendelés száma (E = előrendelés). Ha valakit ki kell hagyni (pl. saját dolgozó), koppints a nevére. <a href="#" onclick="event.preventDefault();rfFb()">Inkább Facebook-játékot sorsolok</a></div>`:`<ol class="rf-help"><li>Nyisd meg a posztot, és kapcsold a hozzászólásokat <b>„Az összes hozzászólás”</b> nézetre.</li><li>Másold ki a hozzászólók nevét (vagy írd be őket), és illeszd be ide. Az ismétlődéseket és a gombfeliratokat a program kiszűri.</li><li>Ha egy sor nem név (pl. egy hozzászólás szövege), koppints rá a fenti listában, és kimarad a sorsolásból.</li></ol>
  <div class="hint">A megosztókat a Facebook nem mutatja meg (a csak ismerősöknek szóló megosztások rejtettek), és a Facebook szabályai szerint a megosztás nem is lehet a részvétel feltétele. A „kommentelj és nyerj” játék szabályos és teljesen ellenőrizhető.</div>`}
  <div class="list" style="margin-top:16px">
    <div class="row"><span class="tx" style="flex:1">Nyertesek</span><span class="rf-step"><button onclick="rfStep('winners',-1)">−</button><b>${RF.winners}</b><button onclick="rfStep('winners',1)">+</button></span></div>
    <div class="row"><span class="tx" style="flex:1">Pótnyertes <small style="color:var(--label2);font-size:13px">ha a nyertes nem jelentkezik</small></span><span class="rf-step"><button onclick="rfStep('reserves',-1)">−</button><b>${RF.reserves}</b><button onclick="rfStep('reserves',1)">+</button></span></div>
  </div>
  <div class="hint" id="rfErr" style="color:var(--red)"></div>
  <button class="bigbtn blue" style="background:var(--purple)" onclick="rfDraw(this)">Sorsolás indítása</button>
  ${RF.hist.length?`<div class="flabel">Korábbi sorsolások</div><div class="list rf-hist">${RF.hist.slice(0,10).map(h=>`<div class="row"><span class="tx"><b>${esc(h.winners.join(', '))}</b><small>${esc(h.title||'Sorsolás')} · ${fmtDay(h.at)} ${fmtTime(h.at)} · ${h.count} résztvevő${h.reserves&&h.reserves.length?' · pót: '+esc(h.reserves.join(', ')):''}</small></span>${h.link?`<a href="${esc(h.link)}" target="_blank" rel="noopener" style="font-size:14px">Poszt</a>`:''}</div>`).join('')}</div>`:''}`;
}
function rfActive(){return RF.clean.filter(n=>!RF.off.has(n))}
function rfChips(){if(!RF.clean.length)return '';return `<div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0">${RF.clean.map((n,i)=>`<button onclick="rfToggle(${i})" style="padding:6px 10px;border-radius:14px;font-size:14px;background:${RF.off.has(n)?'var(--fill2)':'var(--card)'};color:${RF.off.has(n)?'var(--label3)':'var(--label)'};${RF.off.has(n)?'text-decoration:line-through;':''}box-shadow:inset 0 0 0 .5px var(--sep)">${esc(n)}</button>`).join('')}</div>`}
function rfToggle(i){const n=RF.clean[i];RF.off.has(n)?RF.off.delete(n):RF.off.add(n);$('rfChips').innerHTML=rfChips();$('rfCount').innerHTML=rfCountTxt()}
function rfCountTxt(){const n=rfActive().length;if(!RF.names.trim())return 'Még nincs résztvevő.';return `<b>${n}</b> résztvevő${RF.off.size?` (${RF.off.size} kihagyva)`:''}${RF.clean.length?' – koppints egy névre a kihagyáshoz':' – nem találtunk nevet'}`}
function rfCount(){clearTimeout(rfT);rfT=setTimeout(async()=>{try{const d=await api('/api/raffle/preview',{names:RF.names});RF.clean=d.names||[];$('rfCount').innerHTML=rfCountTxt();$('rfChips').innerHTML=rfChips()}catch(e){}},350)}
function rfStep(k,d){const min=k==='winners'?1:0;RF[k]=Math.max(min,Math.min(10,RF[k]+d));const st=$('rfNames').scrollTop;rfForm();$('rfNames').scrollTop=st}
async function rfDraw(btn){
  const err=m=>{$('rfErr').textContent=m};
  if(RF.src!=='orders'&&!/^https?:\/\/\S+\.\S+/.test(RF.link.trim()))return err('Illeszd be a Facebook-poszt linkjét.');
  if(!rfActive().length)return err('Még nincs résztvevő.');
  btn.disabled=true;let d;
  try{d=await api('/api/raffle',{title:RF.title,link:RF.link.trim(),names:rfActive().join('\n'),winners:RF.winners,reserves:RF.reserves})}catch(e){btn.disabled=false;return err(e.message)}
  // pörgetés
  $('rfBody').innerHTML=`<div class="rf-stage"><div class="rf-k">${esc(d.title||'Sorsolás')} · ${d.count} résztvevő</div><div class="rf-wheel spin" id="rfWheel"></div><div class="rf-sub">Sorsolás folyamatban…</div></div>`;
  const pool=d.names,wh=$('rfWheel');let delay=45,t0=performance.now();
  await new Promise(res=>{const tick=()=>{wh.textContent=pool[Math.floor(Math.random()*pool.length)];const el=performance.now()-t0;if(el>3200){res();return}delay=el<1800?45:delay*1.18;setTimeout(tick,delay)};tick()});
  rfResult(d);RF.hist.unshift(d);
}
async function rfNotify(b,winners){b.disabled=true;b.textContent='Küldés…';
  try{const d=await api('/api/giveaway/notify',{winners});
    $('rfMail').innerHTML=d.results.map(x=>`<div class="row"><span class="tx" style="flex:1"><b style="display:block">${esc(x.name)}</b><small style="display:block;color:${x.ok?'var(--green)':'var(--red)'};font-size:13px;margin-top:2px">${x.ok?'✓ E-mail elküldve: '+esc(x.email):esc(x.error)}</small></span></div>`).join('')}
  catch(e){b.disabled=false;b.textContent='Újra';toast(e.message)}}
function rfCopy(b){const ta=$('rfAnn');const done=()=>{b.textContent='Kimásolva ✓';setTimeout(()=>b.textContent='Bejelentés másolása',2000)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(ta.value).then(done);else{ta.select();document.execCommand('copy');done()}}
function rfResult(d){
  const W=d.winners,multi=W.length>1,ord=W.some(w=>/ – #?E?\d+$/.test(w));
  // a bejelentésbe csak a név kerül (a telefonszám és a rendelésszám nem)
  const pub=W.map(w=>ord?w.split(' – ')[0]:w);
  const ann=ord?`🎉 ${d.title?d.title+' – ':''}${multi?'a nyertesek':'a nyertes'}: ${pub.join(', ')}! Gratulálunk! ${multi?'A nyeremény átvételéről e-mailben is értesítünk titeket':'A nyeremény átvételéről e-mailben is értesítünk'}. Köszönjük mindenkinek, aki a weboldalunkon rendelt! 🍂 Vadvirág Étterem`
    :`🎉 ${d.title?d.title+' – ':''}${multi?'A nyertesek':'A nyertes'}: ${W.join(', ')}! Gratulálunk! ${multi?'Kérjük, írjatok':'Kérjük, írj'} nekünk üzenetet a nyeremény átvételéhez. 🌸 Vadvirág Étterem`;
  const cols=['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de'];
  const conf=Array.from({length:60},()=>`<i style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};--dx:${(Math.random()*120-60)|0}px;--r:${(Math.random()*720-360)|0}deg;animation-delay:${(Math.random()*.5).toFixed(2)}s"></i>`).join('');
  $('rfBody').innerHTML=`<div class="rf-stage"><div class="rf-conf">${conf}</div>
    <div class="rf-win"><div class="rf-crown">${I_GIFT}</div><div class="rf-k">${multi?'A nyertesek':'A nyertes'}</div>
    ${W.map(w=>ord?`<div class="rf-name">${esc(w.split(' – ')[0])}</div><div class="rf-sub" style="margin:-2px 0 6px">${esc(w.split(' – ').slice(1).join(' · '))}</div>`:`<div class="rf-name">${esc(w)}</div>`).join('')}
    <div class="rf-sub">Gratulálunk! 🎉</div>
    ${d.reserves&&d.reserves.length?`<div class="rf-res">Pótnyertes: <b>${esc(d.reserves.join(', '))}</b></div>`:''}</div></div>
  <div class="hint" style="text-align:center">${esc(d.title||'Sorsolás')} · ${fmtDay(d.at)} ${fmtTime(d.at)} · ${d.count} résztvevő közül · #${d.id}</div>
  ${ord?`<div class="flabel">Értesítés e-mailben</div><div class="list" id="rfMail"><div class="row"><span class="tx" style="flex:1">A nyertesek e-mailt kapnak arról, hogy nyertek, és hogyan vehetik át a nyereményt.</span><button class="rf-load" onclick='rfNotify(this,${esc(JSON.stringify(W))})'>Küldés</button></div></div>`:''}
  <div class="flabel">Bejelentés szövege${ord?' (Facebookra)':''}</div>
  <div class="list"><div class="row"><textarea id="rfAnn" style="min-height:90px">${esc(ann)}</textarea></div></div>
  <button class="bigbtn blue" onclick="rfCopy(this)">Bejelentés másolása</button>
  ${d.link?`<a class="bigbtn ghost" style="display:grid;place-items:center;margin-top:10px" href="${esc(d.link)}" target="_blank" rel="noopener">Poszt megnyitása</a>`:''}
  <button class="bigbtn ghost" style="margin-top:10px" onclick="rfForm()">Vissza</button>`;
}
function savePass(btn){busy(btn,async()=>{await api('/api/settings/password',{current:$('spCur').value,new:$('spNew').value});$('spCur').value=$('spNew').value='';toast('Jelszó módosítva')})}
async function doImport(inp){
  const fs=[...inp.files];inp.value='';if(!fs.length)return;
  if(!confirm('Biztosan visszaállítod? A mostani rendelések és beállítások helyére a kiválasztott fájlok kerülnek.'))return;
  try{const files=[];for(const f of fs)files.push({name:f.name,content:await f.text()});
    await api('/api/import',{files});dSet.close();toast('Visszaállítva, újraindulás…');
    await new Promise(r=>setTimeout(r,1500));for(let i=0;i<40;i++){try{const r=await fetch('/healthz',{cache:'no-store'});if(r.ok)break}catch(e){}await new Promise(r=>setTimeout(r,500))}
    location.reload();
  }catch(e){toast(e.message||'Hiba')}
}
notifInit().then(()=>{render();renderNotif()});
load();setInterval(load,4000);
