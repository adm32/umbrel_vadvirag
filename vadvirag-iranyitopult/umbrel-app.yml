manifestVersion: 1
id: vadvirag-iranyitopult
name: Vadvirág Irányítópult
tagline: Rendelések, látogatók és hibafigyelés egy helyen, értesítéssel
icon: "data:image/png;base64,"
category: automation
version: "1.2.2"
port: 4749
description: >-
  A Vadvirág Étterem irányítópultja: az összes rendelés és bevétel,
  a weboldal látogatottsága (élő látogatók, napi látogatók, honnan jönnek,
  milyen eszközről és nyelven, mit néznek meg, mit tesznek kosárba, melyik
  településről keresnek kiszállítást), és állapotfigyelés.


  Ha valami elromlik (nem válaszol a weboldal vagy a rendeléskezelő, nem
  működik az online rendelés, a domain kívülről nem érhető el, egy rendelés
  túl régóta vár, nem ment el egy e-mail, hiba van a weboldalon, fogy a hely),
  értesítést küld a telefonodra az ntfy appon keresztül. Kérésre minden új
  rendelésről és napi összesítőt is küld.


  Csak Umbrel-bejelentkezés után nyitható meg. Ehhez a Vadvirág Weboldal (1.3.0)
  és a Vadvirág Rendelések (2.7.0) app is kell.
