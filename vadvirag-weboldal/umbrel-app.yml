description: >-
  A Vadvirág Étterem saját weboldala, három nyelven (magyar, német, angol).
  Étlap és itallap kereséssel, „Mit egyek ma?” sorsoló, kiszállítási díj
  kereső, rendezvények, galéria, nyitvatartás és üzenetküldés
  (asztalfoglalás, rendezvény-ajánlatkérés).


  Az étlapot élőben a Vadvirág Rendelések appból veszi, és a /rendeles
  oldalt is azon keresztül szolgálja ki, így a vendég végig a saját
  domainen marad. Az üzenetek a Rendelések app boríték ikonja alatt jelennek meg.
  Ehhez a Vadvirág Rendelések appnak (2.4 vagy újabb) is futnia kell.
