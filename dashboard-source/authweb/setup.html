<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Irányítópult">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Irányítópult – jelszó beállítása</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;--fill:rgba(118,118,128,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.6);--blue:#0a84ff;--red:#ff453a;--fill:rgba(118,118,128,.24)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
form{width:100%;max-width:360px;text-align:center;animation:in .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ic{width:84px;height:84px;border-radius:20px;margin:0 auto 18px;box-shadow:0 10px 30px rgba(196,20,10,.3);display:block}
h1{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:.01em}
p{margin:0 0 28px;color:var(--label2);font-size:15px}
.field{background:var(--card);border-radius:12px;display:flex;align-items:center;padding:0 16px}
input{flex:1;border:0;background:transparent;color:var(--label);font:inherit;padding:15px 0;outline:none;min-width:0}
button{margin-top:16px;width:100%;height:52px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .12s,filter .12s}
button:active{transform:scale(.98);filter:brightness(.92)}
.err{color:var(--red);margin-top:14px;font-size:15px;display:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{color:var(--label2);font-size:13px;margin-top:10px}
.field+.field{margin-top:1px;border-top-left-radius:0;border-top-right-radius:0}
.field.top{border-bottom-left-radius:0;border-bottom-right-radius:0}
</style></head><body>
<form method="post" action="/setup" id="f">
<img class="ic" src="/icon.png" alt="">
<h1>Jelszó beállítása</h1><p>Az Irányítópult mostantól csak ezzel a jelszóval nyílik meg.</p>
<div class="field top"><input type="password" name="jelszo" autofocus autocomplete="new-password" placeholder="Új jelszó" minlength="6" required></div>
<div class="field"><input type="password" name="jelszo2" autocomplete="new-password" placeholder="Még egyszer" minlength="6" required></div>
<button>Mentés és belépés</button>
<div class="hint">Legalább 6 karakter. Később az Értesítések fülön módosíthatod.</div>
<div class="err" id="e"></div>
</form>
<script>const q=new URLSearchParams(location.search).get('hiba');if(q){const e=document.getElementById('e');e.textContent={rovid:'A jelszó legalább 6 karakter legyen.',nemegyezik:'A két jelszó nem egyezik.',mentes:'Nem sikerült menteni, próbáld újra.'}[q]||'Hiba történt.';e.style.display='block'}</script>
</body></html>
